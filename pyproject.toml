[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "vairrify"
version = "0.0.1"
description = "Detecting bias-driven predictions in repertoire machine learning."
authors = [
  { name = "Vincent M.L. Van Deuren" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = ">=3.10"
dependencies = [
    "tcrio>=0.6.0b7",
    "polars>=1.42,<2.0",  # as tcrio: its compiled plugin is tied to the polars ABI
    "numpy>=2.2",
    "pandas>=2.0",
    "pyarrow>=14",  # polars -> pandas, for the seaborn heatmaps
    "scipy>=1.14",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "shap>=0.45",
]

[project.optional-dependencies]
dev = ["jupyterlab", "nbconvert", "pytest", "ruff"]
docs = ["mkdocs>=1.6", "mkdocs-jupyter>=0.27"]  # docs/hooks needs mkdocs 1.6; notebook_dirs tested on 0.27

[project.urls]
Repository = "https://github.com/vincentvandeuren/vairrify"


[tool.ruff]
line-length = 99
src = ["vairrify"]
include = ["pyproject.toml", "vairrify/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["vairrify"]
force-sort-within-sections = true

